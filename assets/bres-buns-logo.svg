<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Bre's Buns logo</title>
<desc id="desc">A cute pink bakery badge with a blonde cartoon baker holding a cinnamon roll and the words Bre's Buns.</desc>
<defs>
  <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffaf6"/><stop offset="1" stop-color="#ffe6ee"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0ba"/><stop offset=".55" stop-color="#f0bd70"/><stop offset="1" stop-color="#c98445"/></linearGradient>
  <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9a36e"/><stop offset="1" stop-color="#a95e3b"/></linearGradient>
  <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5b3029" flood-opacity=".18"/></filter>
</defs>

<circle cx="400" cy="385" r="320" fill="#fff8f4" stroke="#6b3434" stroke-width="18"/>
<circle cx="400" cy="385" r="298" fill="url(#cream)" stroke="#f2a3bb" stroke-width="9"/>

